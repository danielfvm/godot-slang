name: Build GDExtension Editor
on:
  workflow_call:
  push:
  pull_request:
  merge_group:

jobs:
  build-editor:
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            { platform: windows, arch: x86_64, os: windows-2022 },
              # { platform: windows, arch: arm64, os: windows-11-arm },
            { platform: linux, arch: x86_64, os: ubuntu-22.04 },
            { platform: macos, arch: universal, os: macos-latest },
          ]
        target-type: [editor]
        float-precision: [single]
        godot-api-version: [4.5]

    runs-on: ${{ matrix.target.os }}
    steps:
      # Clone this repository with full depth for Slang version tags
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # Setup MSVC for Windows Editor builds (Required for CMake/Slang)
      - name: Setup MSVC Developer Command Prompt
        if: ${{ matrix.target.platform == 'windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # If building natively on windows-11-arm, use 'arm64'. 
          # If cross-compiling from x86_64 to arm64, use 'amd64_arm64'.
          arch: ${{ matrix.target.arch == 'arm64' && 'arm64' || 'amd64' }}

      # Add linux x86_32 toolchain (kept just in case, though not in matrix)
      - name: Install multilib support
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_32' }}
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      # Setup dependencies
      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}
          em-version: 3.1.62

      # Build GDExtension (with caches)
      - name: Restore .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}_${{ matrix.godot-api-version }}

      - name: Build GDExtension
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }} api_version=${{ matrix.godot-api-version }}

      - name: Save .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}_${{ matrix.godot-api-version }}

      # Clean up compilation files
      - name: Windows - Delete compilation files
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        run: |
          Remove-Item addons/shader-slang/bin/windows-${{ matrix.target.arch }}/* -Include *.exp,*.lib,*.pdb,*.exp,*.ilk -Force

      # Upload the build
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-slang-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.float-precision }}-${{ matrix.target-type }}
          path: |
            ${{ github.workspace }}/dummy-file-to-keep-directory-structure.txt
            ${{ github.workspace }}/addons

  merge:
    runs-on: ubuntu-22.04
    needs: [build-editor] # <--- Fixed: Removed reference to the deleted 'build' job
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: godot-slang-*
          merge-multiple: true
          path: merged

      - name: Regenerate .gdextension
        run: python gdextension.py merged/addons/shader-slang

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-slang
          path: merged

      - name: Delete merged artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: godot-slang-*
